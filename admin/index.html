<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site Manager | Vijayshree Healthcare</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/favicon/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login-wrap" id="login">
  <div class="login-card">
    <div class="login-logo"><img src="../assets/images/logo.png" alt="" onerror="this.style.display='none'"></div>
    <h1>Site Manager</h1>
    <p class="login-sub">Sign in with the clinic's Google account to update the website.</p>

    <div class="login-err" id="loginError" style="display:none"></div>

    <button class="btn btn-google btn-block" id="loginBtn" type="button">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5a5.6 5.6 0 0 1-2.4 3.660v3h3.9c2.3-2.1 3.6-5.2 3.6-8.8Z"/>
        <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3a7.2 7.2 0 0 1-10.7-3.8h-4v3.1A12 12 0 0 0 12 24Z"/>
        <path fill="#FBBC05" d="M5.4 14.3a7.1 7.1 0 0 1 0-4.6V6.6h-4a12 12 0 0 0 0 10.8l4-3.1Z"/>
        <path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.4-3.4A12 12 0 0 0 1.4 6.6l4 3.1A7.2 7.2 0 0 1 12 4.8Z"/>
      </svg>
      Sign in with Google
    </button>

    <p class="login-foot" id="loginHint"></p>
  </div>
</div>

<!-- ================= APP ================= -->
<div class="admin" id="app" style="display:none">

  <aside class="sidebar">
    <div class="brand">
      <img src="../assets/favicon/icon-192.png" alt="" onerror="this.style.display='none'">
      <div>
        <div class="brand-name">Site Manager</div>
        <div class="brand-sub">Vijayshree Healthcare</div>
      </div>
    </div>

    <nav id="nav" class="nav"></nav>

    <div class="sidebar-foot">
      <a class="nav-item" href="../index.html" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <span>View website</span>
      </a>
      <button class="nav-item" id="logoutBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>
        </svg>
        <span>Sign out</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <span class="who" id="whoami"></span>
        <span class="dirty-dot" id="dirtyDot" style="display:none" title="Unsaved changes"></span>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost btn-sm" id="revertBtn">Discard changes</button>
        <button class="btn btn-primary" id="saveBtn">Save &amp; publish</button>
      </div>
    </header>

    <div class="mode-banner" id="modeBanner" style="display:none">
      <strong>Preview mode</strong> — Firebase isn't connected yet, so changes save only
      in this browser and only you can see them. Fill in <code>js/firebase-config.js</code>
      to publish to the live site.
    </div>

    <div class="panel" id="panel"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK: loaded only here in the admin, never on the public site -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="../content.js"></script>
<script src="../js/firebase-config.js"></script>
<script src="../js/store.js"></script>
<script src="../js/icons.js"></script>
<script src="js/db.js"></script>
<script src="js/image.js"></script>
<script src="js/schema.js"></script>
<script src="js/editors.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
